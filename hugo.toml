baseURL = 'https://arunkube.org/'
locale = 'en-US'
title = "Arun Bharathwaj | Platform Modernization Architect"

theme = "PaperMod"

enableRobotsTXT = true

[pagination]
  pagerSize = 12

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true


[params]

env = "production"

title = "ArunKube"

description = "Platform modernization, cloud-native solution design, OpenShift architecture and infrastructure automation."

author = "Arun Bharathwaj"

defaultTheme = "auto"

ShowReadingTime = true
ShowShareButtons = true
ShowCodeCopyButtons = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowToc = true
disableSpecial1stPost = true


[params.homeInfoParams]

Title = "Platform Modernization Architect"

Content = """
Cloud-native solutions design

Platform modernization | OpenShift architecture | Infrastructure automation

I shape modern platforms and automation foundations that help organisations deliver change with confidence.
"""


